<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PFM Ads Report 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>PFM Ads Report 2026</h1>
        <div class="sub" id="asof">Đang tải dữ liệu…</div>
      </div>
      <button class="theme" id="themeBtn" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện">◐</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button data-tab="overview" class="on">Tổng quan</button>
      <button data-tab="Meta">Meta</button>
      <button data-tab="TikTok">TikTok</button>
      <button data-tab="Shopee">Shopee Live</button>
    </nav>
    <div class="filters">
      <div class="presets" id="presets">
        <button data-p="d">Ngày mới nhất</button>
        <button data-p="7d">7 ngày</button>
        <button data-p="30d">30 ngày</button>
        <button data-p="mtd">Tháng này</button>
        <button data-p="lm">Tháng trước</button>
        <button data-p="ytd">YTD</button>
      </div>
      <div class="range">
        <label>Từ <input type="date" id="from"></label>
        <label>Đến <input type="date" id="to"></label>
      </div>
      <div class="cmpinfo" id="cmpinfo"></div>
    </div>
  </div>
</header>
<main class="wrap" id="main"><div class="loading">Đang tải dữ liệu…</div></main>
<footer class="wrap foot" id="foot"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
